<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chế độ học thông minh giống Quizlet – prm">
  <title>Học | prm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/learn.css">
</head>
<body class="learn-page">

  <!-- Header -->
  <header class="learn-header">
    <a class="brand" href="index.html"><span class="brand-mark">p</span><span>prm</span></a>
    <div class="learn-header-center">
      <span class="learn-mode-label">✦ Chế độ Học</span>
    </div>
    <div class="learn-header-right">
      <span class="learn-score-display">
        <span class="score-correct" id="hdr-correct">0</span>
        <span class="score-sep">/</span>
        <span class="score-total" id="hdr-total">0</span>
      </span>
      <a class="icon-btn home-icon" href="index.html" aria-label="Về trang chủ">⌂</a>
    </div>
  </header>

  <!-- Progress bar -->
  <div class="learn-progress-bar" role="progressbar" aria-label="Tiến độ học">
    <div class="learn-progress-fill" id="learn-progress-fill"></div>
  </div>

  <!-- Main -->
  <main class="learn-shell page-enter">

    <!-- Round info -->
    <div class="learn-round-info" id="learn-round-info">
      <div class="learn-round-left">
        <span class="round-badge" id="round-badge">Vòng 1</span>
        <span class="round-count" id="round-count">100 câu còn lại</span>
      </div>
      <div class="learn-round-actions">
        <button class="learn-ctrl-btn" id="btn-shuffle" type="button" title="Xáo trộn ngẫu nhiên vị trí các câu hỏi" aria-label="Trộn câu hỏi">
          <span>🔀 Trộn</span>
        </button>
        <button class="learn-ctrl-btn" id="btn-reset" type="button" title="Đặt lại toàn bộ tiến trình học từ đầu" aria-label="Học lại từ đầu">
          <span>↺ Reset</span>
        </button>
      </div>
    </div>

    <!-- Question card -->
    <section class="learn-card" id="learn-card">
      <div class="learn-card-top">
        <span class="learn-tag">Thuật ngữ</span>
        <span class="learn-q-num" id="learn-q-num">Câu 1 / 100</span>
      </div>
      <h1 class="learn-question" id="learn-question">Đang tải...</h1>

      <p class="learn-choose-label" id="learn-choose-label">Chọn đáp án đúng</p>

      <div class="learn-options" id="learn-options"></div>

      <!-- Feedback hint (sai) -->
      <div class="learn-feedback-hint" id="learn-feedback-hint" hidden>
        <span id="feedback-msg">Đừng lo, bạn vẫn đang học mà!</span>
      </div>
    </section>

    <!-- Continue footer (hiện sau khi trả lời) -->
    <div class="learn-footer" id="learn-footer" hidden>
      <span class="learn-continue-hint" id="learn-continue-hint">Nhấn vào câu trả lời đúng hoặc nhấn phím bất kỳ để tiếp tục</span>
      <button class="btn btn-primary learn-continue-btn" id="learn-continue-btn" type="button">Tiếp tục</button>
    </div>

  </main>

  <!-- Complete modal -->
  <div class="modal-backdrop" id="learn-complete-modal" hidden>
    <section class="modal learn-complete-modal-box" role="dialog" aria-modal="true" aria-labelledby="learn-complete-title">
      <div class="modal-icon">✓</div>
      <h2 id="learn-complete-title">Hoàn thành vòng học!</h2>
      <p id="learn-complete-msg">Bạn đã trả lời xong tất cả câu hỏi.</p>

      <div class="learn-complete-stats" id="learn-complete-stats"></div>

      <div class="modal-actions learn-complete-actions" id="learn-complete-actions"></div>
    </section>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/learn.js"></script>
</body>
</html>
